<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from icon-source.svg by `pnpm icons`. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The manifest link is injected by vite-plugin-pwa, so adding one here would ship two. -->
    <!--
      maximum-scale and user-scalable are set to stop pinch-zoom, because there is no zoom in
      this game and a zoomed page turns the next swipe into browser back/forward navigation.
      `touch-action: pan-x pan-y` in index.css does the same job at the gesture level; this is
      the belt to that braces, for engines that honour the meta tag.
      Known tradeoff: this is a WCAG 1.4.4 (Resize Text) concern, and axe-core's meta-viewport
      rule flags it, so that rule is excluded in e2e/accessibility.spec.ts with the reason.
      Text-only zoom and browser font scaling still work; only pinch-to-magnify is blocked.
      Needs a device check on iOS, which is expected to ignore user-scalable for accessibility
      reasons.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Matches the page background per theme, so the mobile browser chrome agrees. -->
    <meta name="theme-color" content="#faf8ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)" />
    <title>2048</title>
    <meta
      name="description"
      content="Join matching tiles to reach 2048. Swipe or use the arrow keys, undo any move, and play in light or dark."
    />
    <!-- Standalone display on iOS, which reads apple-mobile-web-app-title for the home screen. -->
    <meta name="apple-mobile-web-app-title" content="2048" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="2048" />
    <meta
      property="og:description"
      content="Join matching tiles to reach 2048. Swipe or use the arrow keys, undo any move, and play in light or dark."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /*
       * Applies the saved theme before the first paint.
       *
       * Without this, the page renders with the light default and then snaps to dark once
       * React mounts, which is a visible flash on every load. This is deliberately inline:
       * an external file would be fetched after the first paint and too late to help.
       *
       * Phase 9 note: a strict CSP will not allow an inline script. Compute this script's
       * SHA-256 hash at build time and list it in script-src. Do not allow 'unsafe-inline'.
       *
       * Everything is wrapped because storage throws in private mode, and a theme is never
       * worth breaking the page over.
       */
      (() => {
        try {
          let theme = 'system';
          let motion = 'system';
          const raw = localStorage.getItem('fcf-sonnet-2048/v1');
          if (raw) {
            const saved = JSON.parse(raw);
            const found = saved?.data?.settings?.theme;
            if (found === 'light' || found === 'dark' || found === 'system') theme = found;
            const foundMotion = saved?.data?.settings?.motion;
            if (foundMotion === 'system' || foundMotion === 'reduce' || foundMotion === 'full') {
              motion = foundMotion;
            }
          }
          const resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;

          // The stylesheets read data-motion rather than the media query, because a media
          // query cannot see an in-app preference. Setting it here means an override is
          // correct from the very first paint rather than after React mounts.
          const systemWantsLess = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const reduce = motion === 'reduce' || (motion === 'system' && systemWantsLess);
          document.documentElement.dataset.motion = reduce ? 'reduce' : 'full';
        } catch {
          // Light is the declared default in index.css, so there is nothing to repair.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
